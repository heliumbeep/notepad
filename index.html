<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="alt1:config" content="appconfig.json">
  <title>Notepad</title>
  <link rel="icon" type="image/png" href="/notepad/icon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="/notepad/assets/index-C2V40Mq0.js"></script>
  <link rel="stylesheet" crossorigin href="/notepad/assets/index-K8N99ZJ7.css">
</head>

<body>
  <div class="app" id="app">

    <!-- Navbar -->
    <div class="navbar-bar" id="navbar">
      <div class="bg-body-tertiary border-bottom">
        <div class="container-fluid px-2 px-sm-3 py-2">
          <div class="d-flex justify-content-between align-items-center gap-2">

            <!-- Left group -->
            <div class="d-flex flex-wrap gap-1 gap-sm-2 align-items-center">

              <!-- File name + dropdown -->
              <div class="d-flex align-items-center gap-1 gap-sm-2">
                <span id="fileNameDisplay" class="file-name text-secondary small" title="Double-click to rename"></span>
                <div class="dropdown">
                  <button class="btn btn-outline-secondary btn-sm" id="filesDropdownBtn" data-bs-toggle="dropdown"
                    title="Files">
                    <i class="fas fa-folder-open"></i>
                  </button>
                  <ul class="dropdown-menu dropdown-menu-files shadow-sm" id="filesDropdown">
                    <li>
                      <button class="dropdown-item py-1" id="newFileBtn">
                        <i class="fas fa-plus me-2 text-secondary"></i>New file
                      </button>
                    </li>
                    <li>
                      <hr class="dropdown-divider my-1">
                    </li>
                    <div id="filesList"></div>
                  </ul>
                </div>
              </div>

              <span class="vr mx-1" style="height:20px;align-self:center;"></span>

              <button id="boldBtn" class="btn btn-outline-secondary btn-sm" title="Bold (Ctrl+B)"><i
                  class="fas fa-bold"></i></button>
              <button id="italicBtn" class="btn btn-outline-secondary btn-sm" title="Italic (Ctrl+I)"><i
                  class="fas fa-italic"></i></button>
              <button id="underlineBtn" class="btn btn-outline-secondary btn-sm" title="Underline (Ctrl+U)"><i
                  class="fas fa-underline"></i></button>
              <button id="spellBtn" class="btn btn-outline-secondary btn-sm" title="Spell check"><i
                  class="fas fa-spell-check"></i></button>

              <select id="fontSize" class="form-select form-select-sm w-auto" title="Font size">
                <option value="1">10px</option>
                <option value="2" selected>13px</option>
                <option value="3">16px</option>
                <option value="4">18px</option>
                <option value="5">24px</option>
                <option value="6">32px</option>
                <option value="7">48px</option>
              </select>

              <input type="color" id="textColor" class="color-square" title="Text color">

              <span class="vr mx-1" style="height:20px;align-self:center;"></span>

              <button id="clearBtn" class="btn btn-outline-danger btn-sm" title="Clear all"><i
                  class="fas fa-eraser"></i></button>
              <button id="saveBtn" class="btn btn-outline-success btn-sm" title="Save (Ctrl+S)"><i
                  class="fas fa-save"></i></button>

              <span class="vr mx-1" style="height:20px;align-self:center;"></span>

              <button id="exportBtn" class="btn btn-outline-secondary btn-sm" title="Export as JSON">
                <i class="fas fa-file-export"></i>
              </button>
              <label class="btn btn-outline-secondary btn-sm mb-0" title="Import JSON" style="cursor:pointer;">
                <i class="fas fa-file-import"></i>
                <input type="file" id="importInput" accept=".json" style="display:none;">
              </label>

              <span class="vr mx-1" style="height:20px;align-self:center;"></span>

              <span id="charCount" class="text-secondary small"><i class="far fa-keyboard me-1"></i>0</span>
              <span id="saveStatus" class="small" title="All saved"><i
                  class="fas fa-check-circle text-success"></i></span>
            </div>

            <!-- Right group -->
            <div class="d-flex gap-1 gap-sm-2 align-items-center flex-shrink-0">
              <button id="themeBtn" class="btn btn-outline-secondary btn-sm" title="Toggle theme"><i
                  class="fas fa-moon"></i></button>
              <button id="collapseBtn" class="btn btn-outline-secondary btn-sm" title="Collapse toolbar"><i
                  class="fas fa-chevron-up"></i></button>
            </div>

          </div>
        </div>
      </div>
    </div>

    <!-- Floating expand -->
    <div class="floating-expand" id="floatingExpand">
      <button id="floatingExpandBtn" class="btn btn-outline-secondary btn-sm floating-btn shadow-sm"
        title="Expand toolbar">
        <i class="fas fa-chevron-down"></i>
      </button>
    </div>

    <!-- Editor -->
    <div class="editor-container flex-grow-1 overflow-auto">
      <div id="editor" contenteditable="true" class="editor p-3 p-md-4" spellcheck="false"></div>
    </div>
  </div>

  <!-- Modal: clear content -->
  <div class="modal fade" id="confirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body py-3 px-4">
          <p class="mb-0 fw-semibold">Clear all content?</p>
          <p class="text-secondary mb-0" style="margin-top:2px;">This cannot be undone.</p>
        </div>
        <div class="modal-footer gap-2 border-0 pt-0 pb-3 px-4 justify-content-end">
          <button type="button" class="btn btn-secondary btn-sm" id="confirmNo" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger    btn-sm" id="confirmYes">Clear</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: delete file -->
  <div class="modal fade" id="deleteFileModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body py-3 px-4">
          <p class="mb-0 fw-semibold">Delete this file?</p>
          <p class="text-secondary mb-0" style="margin-top:2px;">This cannot be undone.</p>
        </div>
        <div class="modal-footer gap-2 border-0 pt-0 pb-3 px-4 justify-content-end">
          <button type="button" class="btn btn-secondary btn-sm" id="deleteFileNo"
            data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger    btn-sm" id="deleteFileYes">Delete</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal: rename file -->
  <div class="modal fade" id="renameModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-body py-3 px-4">
          <p class="mb-2 small fw-semibold">File name</p>
          <input type="text" id="renameInput" class="form-control form-control-sm" maxlength="25"
            placeholder="Untitled">
        </div>
        <div class="modal-footer gap-2 border-0 pt-0 pb-3 px-4 justify-content-end">
          <button type="button" class="btn btn-secondary btn-sm" id="renameCancel"
            data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary   btn-sm" id="renameConfirm">Save</button>
        </div>
      </div>
    </div>
  </div>

</body>

</html>
